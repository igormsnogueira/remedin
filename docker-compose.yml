services:
  db:
    image: postgres:16
    container_name: remedin-db
    environment:
      POSTGRES_DB: remedin
      POSTGRES_USER: remedin
      POSTGRES_PASSWORD: remedin
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remedin -d remedin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
