services:
  db:
    image: postgres:18
    container_name: remedin-db
    environment:
      POSTGRES_DB: remedin
      POSTGRES_USER: remedin
      POSTGRES_PASSWORD: remedin
    ports:
      - "5433:5432"
    volumes:
      - db-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remedin -d remedin"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    container_name: remedin-api
    environment:
      ConnectionStrings__Remedin: Host=db;Port=5432;Database=remedin;Username=remedin;Password=remedin
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "5032:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    profiles: [carga]
    environment:
      ConnectionStrings__Remedin: Host=db;Port=5432;Database=remedin;Username=remedin;Password=remedin
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data-18:
