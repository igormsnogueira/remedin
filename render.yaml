# Serviço da API no Render, descrito no repositório em vez de configurado no
# painel. Recriar o serviço do zero é ler este arquivo de novo.
#
# Referência: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: remedin-api
    runtime: docker

    # Mesma região do banco no Neon (AWS us-east-2). Com os dois em Ohio, quem
    # acessa do Brasil atravessa o continente uma vez, entre o navegador e a
    # API, e não de novo a cada consulta ao banco.
    region: ohio

    # 0,1 CPU e 512 MB, e o serviço dorme depois de 15 minutos sem acesso. A
    # primeira requisição depois disso demora perto de um minuto.
    plan: free

    branch: main

    # Publica só quando a CI do commit passar. Com "commit", um merge com teste
    # quebrado iria para o ar antes de a CI terminar.
    autoDeployTrigger: checksPass

    # Responde 503 com o banco fora do ar, então o Render não troca a versão
    # em produção por uma que não consegue falar com o banco.
    healthCheckPath: /health

    # Mudança só no front, na documentação ou nos testes não reconstrói a API.
    # O plano gratuito tem minutos de build contados.
    buildFilter:
      paths:
        - src/Remedin.Api/**
        - src/Remedin.Application/**
        - src/Remedin.Domain/**
        - src/Remedin.Infrastructure/**
        - Dockerfile
        - render.yaml

    envVars:
      # O Render encaminha o tráfego para a porta desta variável. A imagem
      # escuta na 8080, então a variável acompanha a imagem, e não o contrário.
      - key: PORT
        value: 8080

      # Pedida no painel na criação do serviço, e nunca escrita aqui. Formato
      # do Npgsql (Host=...;Database=...), não a URL postgresql:// do Neon.
      - key: ConnectionStrings__Remedin
        sync: false

      # As origens que o navegador aceita chamar a API. Não são segredo, e por
      # isso ficam aqui e não no painel.
      - key: Cors__AllowedOrigins__0
        value: https://remedin.onrender.com
      # Endereço anterior do front, mantido só durante a troca de domínio.
      # Sai junto com o serviço antigo.
      - key: Cors__AllowedOrigins__1
        value: https://remedin-web.onrender.com

  # O front, servido como arquivo estático por CDN. Não dorme: quem dorme é a
  # API, e a página já carrega antes de precisar dela.
  #
  # O nome define o subdomínio do onrender.com, que o Render fixa na criação e
  # não deixa trocar depois. Mudar o nome aqui cria um serviço novo.
  - type: web
    name: remedin
    runtime: static

    # Caminhos relativos à raiz do repositório, explícitos. O Vite grava o
    # endereço da API dentro do JavaScript na hora de compilar.
    buildCommand: cd src/Remedin.Web && npm ci && npm run build
    staticPublishPath: ./src/Remedin.Web/dist

    branch: main
    autoDeployTrigger: checksPass

    buildFilter:
      paths:
        - src/Remedin.Web/**
        - render.yaml

    envVars:
      - key: VITE_API_URL
        value: https://remedin-api.onrender.com
      - key: NODE_VERSION
        value: "22"

    # /medicamento/102980354 não existe como arquivo: quem resolve é o React
    # Router, no navegador. Sem esta regra, recarregar a ficha ou abrir um
    # link compartilhado devolve 404. Arquivo que existe de verdade, como os
    # de /assets, é servido antes de a regra ser considerada.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # De onde a página pode carregar código e para onde pode fazer chamada:
      # só a própria origem e a API. Script injetado por terceiro não roda.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          connect-src 'self' https://remedin-api.onrender.com;
          img-src 'self' data:;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      # O Vite põe o hash do conteúdo no nome de cada arquivo de /assets.
      # Arquivo novo tem nome novo, então o navegador pode guardar o antigo
      # para sempre sem risco de servir versão velha.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
