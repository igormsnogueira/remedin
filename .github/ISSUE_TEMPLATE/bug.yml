name: "🐛 Bug"
description: "Relatar um comportamento incorreto ou inesperado"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: "🐛 Descrição do problema"
      description: "O que aconteceu?"
      placeholder: "Ex.: A busca por princípio ativo retorna medicamentos com registro cancelado."
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: "🔁 Passos para reproduzir"
      placeholder: |
        1. Acessar a busca
        2. Pesquisar "dipirona"
        3. Observar o resultado
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: "✅ Comportamento esperado"
      placeholder: "Apenas medicamentos com registro válido deveriam aparecer."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "🧩 Área afetada"
      options:
        - ETL / Ingestão
        - Banco de dados
        - API / Busca
        - Front-end
        - Infra / Deploy
    validations:
      required: true
